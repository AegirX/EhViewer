name: Build index reader APK

on:
  push:
    branches:
      - '*'
  pull_request:
  workflow_dispatch:

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version-file: .java-version

      - name: Install Rust Toolchain
        run: rustup target add thumbv7neon-linux-androideabi

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./app/src/main/rust"
          shared-key: ${{ runner.os }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: CMake Cache
        uses: actions/cache@v5
        with:
          path: app/.cxx
          key: cmake-default-${{ hashFiles('rust-toolchain.toml', 'settings.gradle.kts', 'app/src/main/cpp/CMakeLists.txt', 'app/src/main/rust/Cargo.lock') }}
          restore-keys: cmake-default-

      - name: Compile Kotlin
        run: ./gradlew :app:compileDefaultReleaseKotlin

      - name: Build index reader
        run: ./gradlew :app:assembleDefaultRelease

      - name: Stage APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/default/release/app-default-universal-release.apk out/index-reader.apk 2>/dev/null \
            || cp app/build/outputs/apk/default/release/app-default-arm64-v8a-release.apk out/index-reader.apk
          printf '%s\n' \
            '索引阅读器 / Index Reader' \
            '' \
            'package: moe.tarsin.ehviewer.index' \
            '  独立包名，安装后不会覆盖官方 EhViewer，可共存。' \
            '' \
            '服务器：局域网内自动发现 8765 端口（UDP 广播 + 端口扫描），无需手填地址。' \
            '' \
            '先在索引服务器上运行 start.cmd' \
            '（或 java -cp "tools/lucene-core-3.0.3.jar;server/out" FLServer "E:\index" 8765 web）' \
            > out/README.txt
          ls -l out

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: index-reader-apk
          path: out/
